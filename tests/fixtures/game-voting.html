<!-- Structure returned by Roblox's /games/votingservice/{placeId} endpoint. -->
<li id="voting-section" class="voting-panel body" data-target-id="10"
    data-total-up-votes="5000000" data-total-down-votes="811000" data-user-authenticated="true">
  <div class="spinner spinner-sm loading"></div>
  <div class="vote-summary">
    <div class="voting-details">
      <div class="users-vote">
        <div class="upvote"><span class="icon-like"></span></div>
        <div class="vote-details">
          <div class="vote-container">
            <div class="vote-background"></div>
            <div class="vote-percentage"></div>
            <div class="vote-mask">
              <div class="segment seg-1"></div><div class="segment seg-2"></div>
              <div class="segment seg-3"></div><div class="segment seg-4"></div>
            </div>
          </div>
          <div class="vote-numbers">
            <div class="count-left"><span id="vote-up-text" title="5000000" class="vote-text">5M+</span></div>
            <div class="count-right"><span id="vote-down-text" title="811000" class="vote-text">811K+</span></div>
          </div>
        </div>
        <div class="downvote"><span class="icon-dislike"></span></div>
      </div>
    </div>
  </div>
</li>
